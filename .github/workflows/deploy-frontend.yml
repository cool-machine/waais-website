name: Deploy Vue frontend to Azure Static Web Apps

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  VITE_API_BASE_URL: https://api.whartonai.studio

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --run

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
          VITE_BASE: '/'

      # Prerender the public routes to real HTML so crawlers/link-preview bots
      # see the content without running JavaScript. Non-blocking: the script
      # exits 0 on any failure, and continue-on-error guarantees a prerender
      # problem never stops the deploy (it just ships the plain SPA).
      - name: Prerender public routes (SEO)
        continue-on-error: true
        run: npm run prerender
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}

      - name: Copy SWA config into dist
        run: cp staticwebapp.config.json dist/staticwebapp.config.json

      # Deploy with the SWA CLI instead of the Azure/static-web-apps-deploy
      # action. The action pulls its uploader as a Docker image from
      # mcr.microsoft.com, which intermittently returns 401/429 on its
      # anonymous token endpoint and fails the whole deploy. The CLI fetches
      # StaticSitesClient from a separate Azure CDN, so it isn't affected by
      # those registry incidents. Same deployment token, same prebuilt dist.
      - name: Deploy to Azure Static Web Apps (SWA CLI)
        run: npx -y @azure/static-web-apps-cli@2 deploy ./dist --deployment-token "$SWA_DEPLOY_TOKEN" --env production --verbose
        env:
          SWA_DEPLOY_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
